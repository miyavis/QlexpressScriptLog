server:
  port: 8080

spring:
  application:
    name: rule-log
  jackson:
    default-property-inclusion: always
  # H2 嵌入式数据库（审计日志）：内存模式，重启清空审计（脚本/执行记录仍走 JSON 落盘）
  datasource:
    url: jdbc:h2:mem:rulelog;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always

app:
  # 脚本 JSON 文件存放目录。
  # 相对路径（如 data）锚定“应用所在目录”：开发运行=项目根目录，打 jar 运行=jar 所在目录，
  # 项目拷到任何位置 data 都跟随，不受启动命令工作目录影响；
  # 也可填绝对路径固定位置，例如 D:/project/LogTest/data 或 /opt/rulelog/data
  data-dir: data
  # 执行记录内存保留上限
  max-execution-records: 200
  # 脚本执行超时（毫秒）
  script-timeout-millis: 5000
  # 可选 API 鉴权 token：留空=关闭（Demo 零配置可用）；配置后 /api/* 需带 X-Api-Token 头
  # 生产公网部署建议设置（环境变量 APP_API_TOKEN=xxx 覆盖），前端需同步发送该头
  api-token: ""
  # OpenTelemetry OTLP/HTTP 导出端点；留空=创建 span 但不导出（零告警）
  # 配置后每次执行生成 root span（traceId 与平台一致），Service 调用为 child span、脚本打印为 event
  # 例：http://localhost:4318/v1/traces
  otel:
    endpoint: ""
  # 读公开、写需登录：默认开启。GET 与执行类接口公开，增删改/评审/发布/清空需认证
  # 本地开发可设 APP_SECURITY_ENABLED=false 完全免登录；生产请改默认密码
  security:
    enabled: true
    admin-password: admin123
    viewer-password: viewer123
