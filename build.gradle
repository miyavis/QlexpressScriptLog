/*
 * 根项目：子模块聚合 + 便捷任务转发（保持原有命令可用）。
 */
// ./gradlew bootRun → platform 的 bootRun
tasks.register('bootRun') {
    group = 'application'
    description = '运行 Spring Boot 应用（转发到 :rulelog-platform:bootRun）'
    dependsOn ':rulelog-platform:bootRun'
}
// ./gradlew bootJar → platform 的 bootJar
tasks.register('bootJar') {
    group = 'build'
    description = '构建单 jar（转发到 :rulelog-platform:bootJar）'
    dependsOn ':rulelog-platform:bootJar'
}
// ./gradlew buildFrontend → platform 的 buildFrontend
tasks.register('buildFrontend') {
    group = 'build'
    dependsOn ':rulelog-platform:buildFrontend'
}
