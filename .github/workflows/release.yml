name: Release

# 打 tag（v1.0.0 这样的格式）即自动：构建前端 → 构建 jar → 发布 GitHub Release 并附上 jar
# 服务器部署：从 Release 下载 jar，java -jar rule-log-1.0.0.jar 即可（jar 已内嵌前端页面）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # 也允许在 Actions 页手动触发（仅构建产物，不发布）

permissions:
  contents: write         # 创建 Release 需要

jobs:
  build-and-release:
    name: 构建单 jar 并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: 安装 Node 16
        uses: actions/setup-node@v5
        with:
          node-version: '16'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端单测
        run: npm ci && npm run test
        working-directory: frontend

      - name: 后端单测
        run: ./gradlew test --no-daemon

      - name: 构建单 jar（前端 dist 内嵌）
        run: ./gradlew bootJar --no-daemon

      - name: 发布 GitHub Release（附 jar）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
