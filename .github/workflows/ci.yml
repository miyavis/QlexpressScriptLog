name: CI

# 每次推送 / PR 都跑：后端单测 + 前端单测与构建
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    name: 后端单测（JDK 17）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle 单测
        run: ./gradlew test --no-daemon

  frontend-test:
    name: 前端单测与构建（Node 18）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node 18
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Vitest 单测
        run: npm run test

      - name: Vite 构建
        run: npm run build
