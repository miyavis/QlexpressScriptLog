name: 功能建议
description: 提出新功能或改进想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 先说场景和痛点，而不是直接说"加一个 xx 按钮"。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你设想的使用方式 / 界面 / 行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 其他思路或现有的临时变通办法（可选）。
