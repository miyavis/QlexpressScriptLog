/*
 * rulelog-core：无 Spring 的纯 Java 规则引擎内核。
 * 可作为 SDK 被外部项目通过 Maven/Gradle 引入。
 * 包名与 platform 一致（com.example.rulelog.*），避免大量 import 修改。
 */
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.miyavis'
version = project.findProperty('releaseVersion') ?: '1.1.6-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '-Dfile.encoding=UTF-8'
}

repositories { mavenCentral() }

dependencies {
    // Jackson：序列化工具（api 暴露，SDK 用户需要）
    api libs.jackson.databind
    // QLExpress4：规则引擎（api 暴露，SDK 用户直接用）
    api libs.qlexpress4

    testImplementation libs.junit.jupiter
    testImplementation libs.h2
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'rulelog-core'
        }
    }
}
